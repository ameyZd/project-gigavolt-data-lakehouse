# Project Gigavolt | Milestone 5 | MongoDB document store configuration
# Installed to /etc/mongod.conf by setup/01_install_mongodb.sh (the original is backed up).
#
# Design notes
# - MongoDB runs on the same EC2 instance as MariaDB and the Milestone 4 ChromaDB
#   store, so the RAG pipeline reads all three sources over localhost (low latency).
# - Data lives under /opt/data on the instance's persistent EBS volume, the same pattern
#   used for the Milestone 1 lakehouse files, so it survives Learner Lab shutdowns.
# - A standalone mongod has no quorum/bootstrap ordering problem, so it is
#   safe for systemd to auto-start it after an AWS restart.

storage:
  dbPath: /opt/data/mongodb
  wiredTiger:
    engineConfig:
      # Small cache on purpose: this host also runs MariaDB and the embedding model.
      # 200-50,000 telemetry events fit comfortably in 256 MB.
      cacheSizeGB: 0.25
    collectionConfig:
      blockCompressor: zstd

systemLog:
  destination: file
  logAppend: true
  path: /var/log/mongodb/mongod.log

net:
  port: 27017
  # Only local processes (the RAG pipeline) may connect. Nothing is exposed publicly.
  bindIp: 127.0.0.1

processManagement:
  timeZoneInfo: /usr/share/zoneinfo

operationProfiling:
  # Log any operation slower than 50 ms so retrieval bottlenecks are visible.
  mode: slowOp
  slowOpThresholdMs: 50

# Optional hardening (see README "Optional: MongoDB authentication"):
# security:
#   authorization: enabled
